name: Release plugin

# Tag with the exact manifest version (Obsidian/BRAT convention, no "v" prefix):
#   git tag 0.15.2 && git push origin 0.15.2
# Pre-release tags (anything containing "-", e.g. 0.16.0-beta.1) are marked
# "prerelease" — that is the BRAT beta channel.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Core tests
        run: node scripts/test.mjs

      - name: Build plugin (production)
        working-directory: packages/obsidian
        run: node esbuild.config.mjs production

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./packages/obsidian/manifest.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $TAG does not match manifest version $VERSION"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXTRA=""
          case "$TAG" in
            *-*) EXTRA="--prerelease" ;;
          esac
          gh release create "$TAG" $EXTRA \
            --title "Lexora $TAG" \
            --generate-notes \
            packages/obsidian/main.js \
            packages/obsidian/manifest.json \
            packages/obsidian/styles.css
