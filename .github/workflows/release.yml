name: Release plugin

# Two ways to cut a release (tag always equals the manifest version, no "v" prefix):
#
# 1. Automatic (preferred): bump the version in packages/obsidian/manifest.json,
#    root manifest.json and versions.json, then push to main. If no release for
#    that version exists yet, this workflow creates the tag + release and
#    attaches main.js / manifest.json / styles.css.
#
# 2. Manual: push a tag like 0.15.2. Pre-release versions (anything containing
#    "-", e.g. 0.16.0-beta.1) are marked "prerelease" — the BRAT beta channel.

on:
  push:
    branches: [main]
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version & decide
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./packages/obsidian/manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            if [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match manifest version $VERSION"
              exit 1
            fi
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.ver.outputs.proceed == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install
        if: steps.ver.outputs.proceed == 'true'
        run: npm ci

      - name: Type check
        if: steps.ver.outputs.proceed == 'true'
        run: npx tsc --noEmit

      - name: Core tests
        if: steps.ver.outputs.proceed == 'true'
        run: node scripts/test.mjs

      - name: Build plugin (production)
        if: steps.ver.outputs.proceed == 'true'
        working-directory: packages/obsidian
        run: node esbuild.config.mjs production

      - name: Create GitHub release
        if: steps.ver.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          EXTRA=""
          case "$VERSION" in
            *-*) EXTRA="--prerelease" ;;
          esac
          gh release create "$VERSION" $EXTRA \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Lexora $VERSION" \
            --generate-notes \
            packages/obsidian/main.js \
            packages/obsidian/manifest.json \
            packages/obsidian/styles.css
